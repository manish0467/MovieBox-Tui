[package]
name = "moviebox-android"
version = "0.1.0"
edition = "2024"
publish = false
description = "JNI bridge exposing the MovieBox core engine to the Android app."
license = "MIT OR Apache-2.0"

[lib]
name = "moviebox_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
moviebox-tui = { path = "../..", version = "0.1.26", default-features = false }
jni = "0.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
log = "0.4.33"
