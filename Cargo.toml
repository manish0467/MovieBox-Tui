[package]
name = "moviebox-tui"
exclude = [
    "docs/",
    "Formula/",
    "bucket/",
    ".github/",
    ".githooks/",
    ".cargo/",
    "android/",
    "crates/",
    "install.sh",
    "install.ps1",
    "CONTRIBUTING.md",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "QWEN.md",
    "CONVENTIONS.md",
    ".cursorrules",
    ".cursor/",
    ".windsurfrules",
    ".agents/",
    ".gitignore",
    "book.toml",
    "book/",
]
version = "0.1.27"
edition = "2024"
description = "Terminal interface to find, download, and stream movies, TV shows, and live TV using local media players."
repository = "https://github.com/mesamirh/MovieBox-Tui"
homepage = "https://github.com/mesamirh/MovieBox-Tui"
license = "MIT OR Apache-2.0"
keywords = ["tui", "moviebox", "streaming", "movies", "cli"]
categories = ["command-line-utilities", "multimedia"]
readme = "README.md"
rust-version = "1.90.0"

[workspace]
members = ["crates/moviebox-android"]
# Only the published crate is a default member: the Android bridge depends on
# it by path and must not be packaged against the registry release.
default-members = ["."]

[features]
default = ["tui"]# The terminal frontend. Disable it to build a headless core library
# (used by the Android app, which ships its own Jetpack Compose UI).
tui = [
    "dep:crossterm",
    "dep:flate2",
    "dep:libc",
    "dep:lru",
    "dep:mimalloc",
    "dep:ratatui",
    "dep:ratatui-crossterm",
    "dep:ratatui-image",
    "dep:semver",
    "dep:sha2",
    "dep:tar",
    "dep:unicode-segmentation",
    "dep:unicode-width",
    "dep:zip",
]

[dependencies]
base64 = "0.23.0"
rmp-serde = "1.3.1"
crossterm = { version = "0.29.0", features = ["event-stream"], optional = true }
dirs = "7.0.0"
futures = "0.3.34"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lru = { version = "0.18.1", optional = true }
md-5 = "0.11.0"
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache"], optional = true }
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["crossterm_0_29"], optional = true }
ratatui-image = { version = "11.0.6", default-features = false, optional = true }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
scraper = "0.27.0"
semver = { version = "1.0.28", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal", "process", "net"] }
url = "2.5.8"
unicode-segmentation = { version = "1.12.0", optional = true }
unicode-width = { version = "0.2.0", optional = true }
open = "5.4.0"
percent-encoding = "2.3.2"
log = "0.4.33"
flexi_logger = "0.31.10"
hickory-resolver = { version = "0.25.2", default-features = false, features = ["system-config", "tokio"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
sha2 = { version = "0.11.0", optional = true }
flate2 = { version = "1.0.35", optional = true }
tar = { version = "0.4.44", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
tempfile = "3.17.1"

[lib]
name = "moviebox_tui"
path = "src/lib.rs"

[[bin]]
name = "moviebox-tui"
path = "src/main.rs"
required-features = ["tui"]

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
manual_is_multiple_of = "allow"
nonminimal_bool = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = { version = "0.1.52", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

